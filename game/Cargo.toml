[package]
name = "game"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
engine = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true, features = ["rand", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = { workspace = true }
itertools = { workspace = true }
tracing-subscriber = "0.3.23"
ordermap = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["png"] }
static_assertions = "1.1.0"
enum-map = "3.1.0"
arrayvec = "0.7.8"
noise = { version = "0.9.0", features = ["images"] }
rand = "0.10.2"
render_graph.workspace = true
crevice.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
ustr = "1.1.0"
dirwalk = "1.1.1"
xxhash-rust = { version = "0.8.18", features = ["std", "xxh3"] }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
serde_repr = "0.1.21"
crossbeam-channel = "0.5.17"
bitfield-struct = "0.13.0"

[lints]
workspace = true
